name: Daily encrypted backup
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reposafe-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.REPOSAFE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age git-lfs rclone
      - name: Prepare private runtime configuration
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: python scripts/prepare_runtime.py
      - name: Capture, encrypt, deliver and verify both providers
        env:
          GITHUB_BACKUP_TOKEN: ${{ secrets.GITHUB_BACKUP_TOKEN }}
          RCLONE_CONFIG: ${{ runner.temp }}/reposafe-rclone.conf
        # The bootstrap host is ephemeral; durable coverage tracking uses the independent host.
        run: python -m reposafe --config "$RUNNER_TEMP/reposafe.toml" run --state-dir "$RUNNER_TEMP/reposafe-state" --output "$RUNNER_TEMP/reposafe-output"
      - name: Remove ephemeral runtime material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/reposafe-rclone.conf" "$RUNNER_TEMP/reposafe.toml"
          rm -rf "$RUNNER_TEMP/reposafe-output"
          rm -rf "$RUNNER_TEMP/reposafe-state"
