name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install integration-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age git-lfs rclone
      - name: Compile and test
        run: |
          python -m compileall -q reposafe tests
          python -m unittest discover -s tests -v
      - name: Live public repository recovery smoke
        run: python scripts/smoke_public_repository.py
