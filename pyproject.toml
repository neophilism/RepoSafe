[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposafe"
version = "0.1.0"
description = "Encrypted, independently recoverable GitHub backups"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reposafe = "reposafe.cli:main"

[tool.setuptools.packages.find]
include = ["reposafe*"]
